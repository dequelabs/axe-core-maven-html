name: Tests

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 11, 17]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      # No restore-keys: a prefix match can hand back a node_modules or ~/.m2 from an earlier
      # version, which resolves as a successful build against stale inputs.
      - name: Cache npm dependencies
        uses: actions/cache@v6.1.0
        with:
          path: "**/node_modules"
          key: npm-cache-v1-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-cache-v1-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ matrix.java }}

      - name: Install Maven dependencies
        run: mvn clean install -DskipTests
      - name: Install NPM dependencies
        run: |
          npm ci &&
          npm --prefix=selenium ci &&
          npm --prefix=playwright ci

  license-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Maven compile licenses
        run: mvn compile license:add-third-party
      - name: Check Selenium licenses
        run: node scripts/license-check.js selenium/target/generated-sources/license/THIRD-PARTY.txt
      - name: Check Playwright licenses
        run: node scripts/license-check.js playwright/target/generated-sources/license/THIRD-PARTY.txt

  playwright-tests:
    needs: [license-check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17]
    steps:
      - uses: actions/checkout@v7

      # Without this the matrix is decorative: every leg runs the runner's default JDK.
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - uses: actions/cache@v6.1.0
        name: Restore npm cache
        with:
          path: "**/node_modules"
          key: npm-cache-v1-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - uses: actions/cache@v6.1.0
        name: Restore Maven cache
        with:
          path: ~/.m2/repository
          key: maven-cache-v1-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ matrix.java }}

      # Unconditional: a partial cache hit can restore a node_modules or ~/.m2 that predates the
      # current version, and the fixture download and artifact resolution below both depend on it.
      - name: Install NPM dependencies
        run: |
          npm ci &&
          npm --prefix=playwright ci
      - name: Install Maven dependencies
        run: mvn clean install -DskipTests

      - name: Start fixture server
        run: |
          npm --prefix=playwright start > /tmp/fixture-server-1337.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:1337/index.html > /dev/null; do sleep 0.5; done' || {
            echo "::error::fixture server on port 1337 never came up"
            cat /tmp/fixture-server-1337.log
            exit 1
          }
      - name: Run Playwright tests
        run: mvn test -q -pl playwright

  # No JDK matrix: junit-vintage-engine 6.x pulls a JUnit Platform compiled for Java 17, so this
  # module's tests cannot run on 8 or 11 regardless of the library's own target.
  selenium-tests:
    needs: [license-check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"

      - uses: actions/cache@v6.1.0
        name: Restore npm cache
        with:
          path: "**/node_modules"
          key: npm-cache-v1-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - uses: actions/cache@v6.1.0
        name: Restore Maven cache
        with:
          path: ~/.m2/repository
          key: maven-cache-v1-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-17

      - name: Install NPM dependencies
        run: |
          npm ci &&
          npm --prefix=selenium ci
      - name: Install Maven dependencies
        run: mvn clean install -DskipTests

      # `npm --prefix=selenium start` rather than `python -m http.server`: the latter is
      # single-threaded, so the parallel requests a nested-iframe fixture generates serialise and
      # individual frames can exceed the per-frame load budget.
      - name: Start fixture server
        run: |
          npm --prefix=selenium start > /tmp/fixture-server-8001.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:8001/index.html > /dev/null; do sleep 0.5; done' || {
            echo "::error::fixture server on port 8001 never came up"
            cat /tmp/fixture-server-8001.log
            exit 1
          }
      - name: Run Selenium tests
        run: mvn test -q -pl selenium
