name: Sync master/develop branches

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read # Needed to clone the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create_sync_pull_request:
    if: ${{ github.event.pull_request.merged == true }}
    name: Create sync pull request
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Open master into develop pull request
        uses: dequelabs/action-sync-branches@v1.0.2
        with:
          github-token: ${{ secrets.PAT }} # zizmor: ignore[secrets-outside-env]
          pr-title: "chore: merge master into develop"
          pr-team-reviewers: axe-api-team
          pr-labels: chore
          pr-template: .github/PULL_REQUEST_TEMPLATE.md
