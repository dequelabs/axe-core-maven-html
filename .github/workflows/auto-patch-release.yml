name: Automatically create patch release every 2 weeks

on:
  workflow_dispatch:

permissions:
  contents: read # Needed to clone the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_patch_release:
    name: Create release
    permissions:
      contents: write # Needed to push the release branch
      issues: write # Needed to open the QA issue
      pull-requests: write # Needed to open the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release
        uses: dequelabs/axe-api-team-public/.github/actions/auto-patch-release-v1@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          project_token: ${{ secrets.GH_PROJECT_TOKEN }} # zizmor: ignore[secrets-outside-env]
          skip_checks: ${{ github.event_name != 'schedule' }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }} # zizmor: ignore[secrets-outside-env]
          odd_release: 'true'
          release-command: bash .github/scripts/prepare_release.sh
          release-branch: master
          default-branch: develop
